# Fly.io config for the Proof Gatekeeper prover sidecar.
# Deploy:  fly launch --no-deploy --copy-config --name <app>   (or: fly apps create <app>)
#          fly secrets set PROVER_KEY=<same key the Worker sends>
#          fly deploy --remote-only
# Then set the Worker vars: PROVER_URL=https://<app>.fly.dev/prove  PROVER_KEY=<key>
app = "proof-gatekeeper-prover"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # keep it warm for the nightly rounds (no cold-start timeouts)
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
